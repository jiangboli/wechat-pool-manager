# WeChat Gateway Pool Manager v4 — 3 容器模式
pool:
  total_profiles: 500
  hot_pool_size: 20
  max_bound_gateways: 500
  profile_prefix: "weixin-"
  max_qr_refresh: 3

gateway:
  health_check_interval: 900

docker:
  image: "hermes-bot:latest"
  network: "hermes-pool-net"
  data_root: "/home/dosh/data/"
  data_root_host: "/home/dosh/data/"
  max_containers: 500
  container_defaults:
    memory_limit: "512m"
    memory_reservation: "128m"
    cpu_shares: 256
    cpu_quota: 50000
    pids_limit: 1024
    ulimit_nofile: 2048

proxy:
  default_provider: "deepseek"
  fallback_providers: ["alibaba"]
  rate_limit_per_ip: 60                # 每个容器 IP 每分钟请求上限
  circuit_breaker:
    max_errors: 5
    recovery_window: 60

frontend:
  api_port: 8765
  qr_refresh_seconds: 45
  host: "0.0.0.0"
  public_url: ""

logging:
  level: INFO
  dir: "/app/logs/"
  retain_days: 7
  stats_window_hours: 168

ilink:
  base_url: "https://ilinkai.weixin.qq.com"
  qr_timeout_seconds: 480
  qr_poll_interval: 1
