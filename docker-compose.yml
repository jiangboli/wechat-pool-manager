services:
  # ── 绑定页服务 ──────────────────────────────────────────────
  # 对外公开：二维码、绑定页、热池状态轮询
  pool-bind:
    build:
      context: .
      dockerfile: Dockerfile.pool
    image: pool-manager:latest
    container_name: pool-bind
    command: ["--mode", "bind", "--config", "/app/config.yaml"]
    ports:
      - "8765:8765"
    environment:
      CLAW_DO_DSN: "${CLAW_DO_DSN}"
      MACHINE_IP: "${MACHINE_IP:-auto}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME_DATA:-/home/dosh/data}:/home/data
    networks:
      - hermes-pool-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── 管理端服务 ──────────────────────────────────────────────
  # 仅 127.0.0.1 可访问 + Token 认证
  # 用于 gateway 管理、proxy key 管理、状态查询
  pool-admin:
    image: pool-manager:latest
    container_name: pool-admin
    command: ["--mode", "admin", "--config", "/app/config.yaml"]
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME_DATA:-/home/dosh/data}:/home/data
    networks:
      - hermes-pool-net
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      CLAW_DO_DSN: "${CLAW_DO_DSN}"
      MACHINE_IP: "${MACHINE_IP:-auto}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8766/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ── LLM Proxy 服务 ──────────────────────────────────────────
  # 仅 /v1/chat/completions，给 bot 容器使用
  pool-proxy:
    image: pool-manager:latest
    container_name: pool-proxy
    command: ["--mode", "proxy", "--config", "/app/config.yaml"]
    ports:
      - "8767:8767"
    volumes:
      - ${HOME_DATA:-/home/dosh/data}:/home/data
    networks:
      - hermes-pool-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8767/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# ── 共享网络 ────────────────────────────────────────────────────
# hermes-weixin-NNN 容器也加入此网络，通过 DNS 名 "pool-proxy" 访问 LLM Proxy
networks:
  hermes-pool-net:
    name: hermes-pool-net
    external: true