services:
  pool-bind:
    build:
      context: .
      dockerfile: Dockerfile.pool
    image: pool-manager:latest
    container_name: pool-bind
    command: ["--mode", "bind", "--config", "/app/config.yaml"]
    ports:
      - "8765:8765"
    environment:
      CLAW_DO_DSN: "${CLAW_DO_DSN}"
      MACHINE_IP: "${MACHINE_IP:-auto}"
      ANALYTICS_PASSWORD: "${ANALYTICS_PASSWORD}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME_DATA:-/home/dosh/data}:/home/dosh/data
    networks:
      - hermes-pool-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  pool-admin:
    image: pool-manager:latest
    container_name: pool-admin
    command: ["--mode", "admin", "--config", "/app/config.yaml"]
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME_DATA:-/home/dosh/data}:/home/dosh/data
    networks:
      - hermes-pool-net
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      CLAW_DO_DSN: "${CLAW_DO_DSN}"
      MACHINE_IP: "${MACHINE_IP:-auto}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8766/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  pool-proxy:
    image: pool-manager:latest
    container_name: pool-proxy
    command: ["--mode", "proxy", "--config", "/app/config.yaml"]
    ports:
      - "8767:8767"
    environment:
      CLAW_DO_DSN: "${CLAW_DO_DSN}"
      MACHINE_IP: "${MACHINE_IP:-auto}"
    volumes:
      - ${HOME_DATA:-/home/dosh/data}:/home/dosh/data
    networks:
      - hermes-pool-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8767/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  hermes-pool-net:
    name: hermes-pool-net
    external: true
