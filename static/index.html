<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Claw Do It</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-1: #0a0a1a;
    --bg-2: #1a1040;
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.25);
    --accent-subtle: rgba(245, 158, 11, 0.08);
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-glow: rgba(245, 158, 11, 0.06);
    --text-primary: rgba(255, 255, 255, 0.92);
    --text-secondary: rgba(255, 255, 255, 0.55);
    --text-muted: rgba(255, 255, 255, 0.30);
    --success: #34d399;
    --error: #f87171;
    --scan-warn: #fbbf24;
    --radius: 20px;
    --radius-sm: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg-1);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* Background orbs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.15), transparent);
    top: -200px; right: -100px;
  }
  body::after {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.08), transparent);
    bottom: -150px; left: -100px;
  }

  /* Subtle grain overlay */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
  }

  /* Card */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 36px 28px 32px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 8px 32px rgba(0,0,0,0.4),
      0 2px 8px rgba(0,0,0,0.2),
      0 0 60px var(--card-glow);
    transition: box-shadow 0.6s ease;
    text-align: center;
  }

  /* Header */
  .logo {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--accent), #d97706);
    border-radius: 14px;
    display: block;
    object-fit: cover;
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-weight: 400;
  }

  .prompt-text {
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 24px;
    font-weight: 500;
    letter-spacing: 0.02em;
    opacity: 0.85;
    animation: promptFade 2s ease-in-out infinite alternate;
  }

  @keyframes promptFade {
    0% { opacity: 0.65; }
    100% { opacity: 1; }
  }

  /* QR Box */
  .qr-wrapper {
    position: relative;
    margin: 0 auto 20px;
    width: 220px;
    height: 220px;
  }

  .qr-box {
    width: 100%;
    height: 100%;
    border-radius: var(--radius-sm);
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.5s ease, transform 0.3s ease;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .qr-box img {
    width: 180px;
    height: 180px;
    display: block;
    image-rendering: pixelated;
  }

  .qr-placeholder {
    color: #999;
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
    padding: 20px;
  }

  /* QR breathing pulse */
  .qr-box.pulsing {
    animation: qrPulse 2.5s ease-in-out infinite;
  }

  @keyframes qrPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.15); }
    50% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
  }

  .qr-box.success {
    box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.3), 0 0 40px rgba(52, 211, 153, 0.1);
  }
  .qr-box.success img { display: none; }
  .qr-box .success-icon {
    display: none;
    font-size: 56px;
    line-height: 1;
  }
  .qr-box.success .success-icon { display: block; animation: successPop 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes successPop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .qr-box.error {
    box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.2);
  }

  /* Outer ring decoration */
  .qr-wrapper::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: calc(var(--radius-sm) + 6px);
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
  }

  /* Status */
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 28px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 4px;
    transition: color 0.3s;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
  }
  .status .dot.pulse {
    animation: dotPulse 1.2s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .status.waiting { color: var(--accent); }
  .status.waiting .dot { background: var(--accent); }

  .status.scanned { color: var(--scan-warn); }
  .status.scanned .dot { background: var(--scan-warn); }

  .status.success { color: var(--success); }
  .status.success .dot { background: var(--success); }

  .status.error { color: var(--error); }
  .status.error .dot { background: var(--error); }

  .countdown {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
    min-height: 18px;
  }

  /* Steps */
  .steps {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }

  .step {
    flex: 1;
    padding: 10px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.04);
    text-align: center;
  }

  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent-subtle);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .step-label {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.3;
  }

  /* Refresh button */
  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 24px;
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .refresh-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.10);
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.15);
  }

  .refresh-btn:active:not(:disabled) {
    transform: scale(0.97);
  }

  .refresh-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .refresh-btn .icon {
    font-size: 14px;
    transition: transform 0.4s ease;
  }
  .refresh-btn:not(:disabled):hover .icon {
    transform: rotate(180deg);
  }

  /* Stats */
  .stats {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Ticker — 滚动抢虾消息 */
  .ticker {
    margin: -6px 0 18px;
    font-size: 12px;
    color: var(--accent);
    opacity: 0.7;
    min-height: 18px;
    animation: tickerFade 1.5s ease-in-out infinite alternate;
  }
  @keyframes tickerFade {
    0% { opacity: 0.5; }
    100% { opacity: 0.85; }
  }

  /* Loading skeleton for QR */
  .qr-skeleton {
    width: 180px;
    height: 180px;
    border-radius: 8px;
    background: linear-gradient(135deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
    background-size: 200% 200%;
    animation: skeleton 1.5s ease-in-out infinite;
  }

  @keyframes skeleton {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Responsive */
  @media (max-width: 440px) {
    body { padding: 12px; }
    .card { padding: 24px 16px 24px; border-radius: 16px; }
    .qr-wrapper { width: 180px; height: 180px; }
    .qr-box img { width: 150px; height: 150px; }
    .qr-skeleton { width: 150px; height: 150px; }
    h1 { font-size: 20px; }
    .steps { flex-direction: column; gap: 4px; }
    .step { display: flex; align-items: center; gap: 8px; padding: 8px 12px; text-align: left; }
    .step-num { margin-bottom: 0; flex-shrink: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .qr-box.pulsing { animation: none; }
    .qr-skeleton { animation: none; }
    .refresh-btn .icon { transition: none; }
    .refresh-btn:not(:disabled):hover .icon { transform: none; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<div class="container">
  <div class="card" id="card">
    <!-- Logo -->
    <img class="logo" src="dosh.png" alt="logo">

    <!-- Title -->
    <h1>Just Claw Do It</h1>
    <p class="subtitle">在微信里养一只属于自己的虾</p>

    <!-- Prompt / 抢虾消息 -->
    <p class="prompt-text" id="promptText">📢 请及时领取您的虾苗</p>

    <!-- 滚动消息 -->
    <div class="ticker" id="ticker">
      <span id="tickerText">👀 5个坑位正在等你...</span>
    </div>

    <!-- QR Code -->
    <div class="qr-wrapper">
      <div class="qr-box pulsing" id="qrBox">
        <div class="qr-placeholder" id="qrContent">
          <div class="qr-skeleton"></div>
        </div>
        <div class="success-icon">✓</div>
      </div>
    </div>

    <!-- Status -->
    <div class="status" id="status">
      <span class="dot pulse" id="statusDot"></span>
      <span id="statusText">准备中...</span>
    </div>

    <!-- Steps -->
    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-label">打开微信「扫一扫」</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-label">扫描上方二维码</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-label">确认登录，自动绑定</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>
  </div>
</div>

<script>
const API_BASE = '';
let currentSlot = null;
let statusTimer = null;
let fetchRetryTimer = null;
let lastQrUrl = '';
let awaitingConfirmation = false;  // 是否在等待自己扫码的确认

const TICKER_MSGS = [
  '🔥 注意：坑位先到先得！',
  '⚡ 已有 %d 只虾被领养',
  '👀 %d 个坑位等待有缘人...',
  '🎯 扫码要快，姿势要帅',
  '🦞 别犹豫，扫就对了',
];

function showError(msg) {
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box error';
  qrBox.classList.remove('pulsing');
  document.getElementById('qrContent').innerHTML = '<div class="qr-placeholder">' + msg + '</div>';
  setStatus(msg, 'error');
}

function showLoading() {
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box';
  qrBox.classList.add('pulsing');
  document.getElementById('qrContent').innerHTML = '<div class="qr-skeleton"></div>';
  setStatus('获取中...', '');
}

function showQR(url, slotId) {
  currentSlot = slotId;
  lastQrUrl = url;
  awaitingConfirmation = false;
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box';
  qrBox.classList.add('pulsing');
  document.getElementById('qrContent').innerHTML =
    '<img src="/api/v1/pool/qr-image/' + slotId + '?t=' + Date.now() +
    '" alt="微信二维码" id="qrImg" onerror="this.onerror=null;showError(\'二维码加载失败\')">';
  setStatus('📱 请用微信扫一扫', 'waiting');
  startPollingStatus(slotId);
  updateTicker();
}

function refreshSlotImage() {
  if (!currentSlot) return;
  const img = document.getElementById('qrImg');
  if (img) {
    img.src = '/api/v1/pool/qr-image/' + currentSlot + '?t=' + Date.now();
  }
}

function showScanned() {
  awaitingConfirmation = true;
  setStatus('📱 已扫码！请在手机上确认...', 'scanned');
}

function showSuccess() {
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box success';
  qrBox.classList.remove('pulsing');
  document.getElementById('qrContent').innerHTML = '';
  setStatus('🎉 你已成功领养了一只 do 大龙虾！', 'success');
  if (statusTimer) clearInterval(statusTimer);
  document.getElementById('tickerText').textContent = '🏆 领养成功！去微信找你的虾聊天吧';
}

function showSnatched() {
  // 被抢了→自动换下一个
  setStatus('😅 慢了一步，坑位已被抢走！换上新的...', 'error');
  setTicker('⚡ 刚才有人抢走了一个坑位！');
  if (statusTimer) clearInterval(statusTimer);
  // 延迟一下再去获取新的，避免闪烁
  setTimeout(fetchQR, 800);
}

function showExpired() {
  // 过期了→自动换下一个
  setStatus('⏳ 二维码已过期，正在换新...', 'error');
  setTicker('🔄 二维码已刷新');
  if (statusTimer) clearInterval(statusTimer);
  setTimeout(fetchQR, 500);
}

function setStatus(text, type) {
  const el = document.getElementById('status');
  const dot = document.getElementById('statusDot');
  const textEl = document.getElementById('statusText');
  el.className = 'status' + (type ? ' ' + type : '');
  dot.className = 'dot' + (type ? ' pulse' : '');
  textEl.textContent = text;
}

function setTicker(msg) {
  document.getElementById('tickerText').textContent = msg;
}

function updateTicker() {
  let idx = Math.floor(Math.random() * TICKER_MSGS.length);
  let msg = TICKER_MSGS[idx];
  // bound count from stats
  fetch(API_BASE + '/api/v1/pool/stats')
    .then(r => r.json())
    .then(data => {
      msg = msg.replace('%d', data.bound || 0);
      setTicker(msg);
    })
    .catch(() => {});
}

async function fetchQR() {
  try {
    showLoading();
    const resp = await fetch(API_BASE + '/api/v1/pool/available');
    if (!resp.ok) {
      showError('暂无可用二维码，请稍后再试');
      // 重试
      if (fetchRetryTimer) clearTimeout(fetchRetryTimer);
      fetchRetryTimer = setTimeout(fetchQR, 5000);
      return;
    }
    const data = await resp.json();
    showQR(data.qr_url, data.slot_id);
  } catch (e) {
    showError('网络错误，正在重试...');
    if (fetchRetryTimer) clearTimeout(fetchRetryTimer);
    fetchRetryTimer = setTimeout(fetchQR, 3000);
  }
}

async function pollStatus(slotId) {
  try {
    const resp = await fetch(API_BASE + '/api/v1/pool/status/' + slotId);
    if (!resp.ok) {
      // slot not found → 已被移除
      if (resp.status === 404) { showSnatched(); return; }
      return;
    }
    const data = await resp.json();

    // 如果是自己在等扫码确认，bound = 自己绑定成功
    if (awaitingConfirmation && data.bound) { showSuccess(); return; }
    // slot 不在热池了但 bound=true → 自己绑成功了（slot已被移除）
    if (awaitingConfirmation && data.qr_status === 'not_in_pool' && data.bound) {
      showSuccess();
      return;
    }

    // 已被别人抢了 → 换下一个
    if (data.bound) { showSnatched(); return; }

    // 已扫码（等待确认）
    if (data.qr_status === 'scaned') { showScanned(); return; }

    // 过期→自动换新
    if (data.qr_status === 'expired' || data.qr_status === 'not_in_pool') {
      showExpired();
      return;
    }

    // 二维码已更新（后端刷新了）
    if (data.qr_url && data.qr_url !== lastQrUrl) {
      lastQrUrl = data.qr_url;
      refreshSlotImage();
    }
  } catch (e) {}
}

function startPollingStatus(slotId) {
  if (statusTimer) clearInterval(statusTimer);
  statusTimer = setInterval(() => pollStatus(slotId), 1500);
}

// Init
showLoading();
fetchQR();
setInterval(updateTicker, 8000);
setInterval(() => {
  fetch(API_BASE + '/api/v1/pool/stats')
    .then(r => r.json())
    .then(d => { document.getElementById('stats').textContent = '已绑定 ' + d.bound + ' / 总 ' + d.total_profiles + ' 个席位'; })
    .catch(() => {});
}, 10000);
</script>
</body>
</html>
