<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Claw Do 一下</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-1: #0a0a1a;
    --bg-2: #1a1040;
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.25);
    --accent-subtle: rgba(245, 158, 11, 0.08);
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-glow: rgba(245, 158, 11, 0.06);
    --text-primary: rgba(255, 255, 255, 0.92);
    --text-secondary: rgba(255, 255, 255, 0.55);
    --text-muted: rgba(255, 255, 255, 0.30);
    --success: #34d399;
    --error: #f87171;
    --scan-warn: #fbbf24;
    --radius: 20px;
    --radius-sm: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg-1);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* Background orbs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.15), transparent);
    top: -200px; right: -100px;
  }
  body::after {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.08), transparent);
    bottom: -150px; left: -100px;
  }

  /* Subtle grain overlay */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
  }

  /* Card */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 36px 28px 32px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 8px 32px rgba(0,0,0,0.4),
      0 2px 8px rgba(0,0,0,0.2),
      0 0 60px var(--card-glow);
    transition: box-shadow 0.6s ease;
    text-align: center;
  }

  /* Header */
  .logo {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--accent), #d97706);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 28px;
    font-weight: 400;
  }

  /* QR Box */
  .qr-wrapper {
    position: relative;
    margin: 0 auto 20px;
    width: 220px;
    height: 220px;
  }

  .qr-box {
    width: 100%;
    height: 100%;
    border-radius: var(--radius-sm);
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.5s ease, transform 0.3s ease;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .qr-box img {
    width: 180px;
    height: 180px;
    display: block;
    image-rendering: pixelated;
  }

  .qr-placeholder {
    color: #999;
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
    padding: 20px;
  }

  /* QR breathing pulse */
  .qr-box.pulsing {
    animation: qrPulse 2.5s ease-in-out infinite;
  }

  @keyframes qrPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.15); }
    50% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
  }

  .qr-box.success {
    box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.3), 0 0 40px rgba(52, 211, 153, 0.1);
  }
  .qr-box.success img { display: none; }
  .qr-box .success-icon {
    display: none;
    font-size: 56px;
    line-height: 1;
  }
  .qr-box.success .success-icon { display: block; animation: successPop 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes successPop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .qr-box.error {
    box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.2);
  }

  /* Outer ring decoration */
  .qr-wrapper::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: calc(var(--radius-sm) + 6px);
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
  }

  /* Status */
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 28px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 4px;
    transition: color 0.3s;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
  }
  .status .dot.pulse {
    animation: dotPulse 1.2s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .status.waiting { color: var(--accent); }
  .status.waiting .dot { background: var(--accent); }

  .status.scanned { color: var(--scan-warn); }
  .status.scanned .dot { background: var(--scan-warn); }

  .status.success { color: var(--success); }
  .status.success .dot { background: var(--success); }

  .status.error { color: var(--error); }
  .status.error .dot { background: var(--error); }

  .countdown {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
    min-height: 18px;
  }

  /* Steps */
  .steps {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }

  .step {
    flex: 1;
    padding: 10px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.04);
    text-align: center;
  }

  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent-subtle);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .step-label {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.3;
  }

  /* Refresh button */
  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 24px;
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .refresh-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.10);
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.15);
  }

  .refresh-btn:active:not(:disabled) {
    transform: scale(0.97);
  }

  .refresh-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .refresh-btn .icon {
    font-size: 14px;
    transition: transform 0.4s ease;
  }
  .refresh-btn:not(:disabled):hover .icon {
    transform: rotate(180deg);
  }

  /* Stats */
  .stats {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Loading skeleton for QR */
  .qr-skeleton {
    width: 180px;
    height: 180px;
    border-radius: 8px;
    background: linear-gradient(135deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
    background-size: 200% 200%;
    animation: skeleton 1.5s ease-in-out infinite;
  }

  @keyframes skeleton {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Responsive */
  @media (max-width: 440px) {
    body { padding: 12px; }
    .card { padding: 24px 16px 24px; border-radius: 16px; }
    .qr-wrapper { width: 180px; height: 180px; }
    .qr-box img { width: 150px; height: 150px; }
    .qr-skeleton { width: 150px; height: 150px; }
    h1 { font-size: 20px; }
    .steps { flex-direction: column; gap: 4px; }
    .step { display: flex; align-items: center; gap: 8px; padding: 8px 12px; text-align: left; }
    .step-num { margin-bottom: 0; flex-shrink: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .qr-box.pulsing { animation: none; }
    .qr-skeleton { animation: none; }
    .refresh-btn .icon { transition: none; }
    .refresh-btn:not(:disabled):hover .icon { transform: none; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<div class="container">
  <div class="card" id="card">
    <!-- Logo -->
    <div class="logo">🦞</div>

    <!-- Title -->
    <h1>Just Claw Do 一下</h1>
    <p class="subtitle">欢迎领养你的 水华 大龙虾</p>

    <!-- QR Code -->
    <div class="qr-wrapper">
      <div class="qr-box pulsing" id="qrBox">
        <div class="qr-placeholder" id="qrContent">
          <div class="qr-skeleton"></div>
        </div>
        <div class="success-icon">✓</div>
      </div>
    </div>

    <!-- Status -->
    <div class="status" id="status">
      <span class="dot pulse" id="statusDot"></span>
      <span id="statusText">准备中...</span>
    </div>
    <div class="countdown" id="countdown"></div>

    <!-- Steps -->
    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-label">打开微信「扫一扫」</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-label">扫描上方二维码</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-label">确认登录，自动绑定</div>
      </div>
    </div>

    <!-- Refresh -->
    <button class="refresh-btn" id="refreshBtn" onclick="refreshQR()">
      <span class="icon">↻</span>
      刷新二维码
    </button>

    <!-- Stats -->
    <div class="stats" id="stats"></div>
  </div>
</div>

<script>
const API_BASE = '';
let currentSlot = null;
let qrTimer = null;
let statusTimer = null;
let countdownValue = 35;

function showError(msg) {
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box error';
  qrBox.classList.remove('pulsing');
  document.getElementById('qrContent').innerHTML = '<div class="qr-placeholder">' + msg + '</div>';
  setStatus(msg, 'error');
}

function showLoading() {
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box';
  qrBox.classList.add('pulsing');
  document.getElementById('qrContent').innerHTML = '<div class="qr-skeleton"></div>';
  setStatus('获取中...', '');
}

function showQR(url, slotId) {
  currentSlot = slotId;
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box';
  qrBox.classList.add('pulsing');
  document.getElementById('qrContent').innerHTML =
    '<img src="/api/v1/pool/qr-image/' + slotId +
    '" alt="微信二维码" id="qrImg" onerror="this.onerror=null;showError(\'二维码加载失败\')">';
  setStatus('等待扫码...', 'waiting');
  document.getElementById('refreshBtn').disabled = false;
}

function showScanned() {
  setStatus('已扫码！请在手机上确认...', 'scanned');
}

function showSuccess() {
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box success';
  qrBox.classList.remove('pulsing');
  document.getElementById('qrContent').innerHTML = '';
  setStatus('绑定成功！你已领养了一只 do 大龙虾 ✨', 'success');
  document.getElementById('refreshBtn').disabled = true;
  if (qrTimer) clearInterval(qrTimer);
  if (statusTimer) clearInterval(statusTimer);
}

function setStatus(text, type) {
  const el = document.getElementById('status');
  const dot = document.getElementById('statusDot');
  const textEl = document.getElementById('statusText');
  el.className = 'status' + (type ? ' ' + type : '');
  dot.className = 'dot' + (type ? ' pulse' : '');
  textEl.textContent = text;
}

async function fetchQR() {
  try {
    const resp = await fetch(API_BASE + '/api/v1/pool/available');
    if (!resp.ok) {
      showError('暂无可用二维码，请稍后再试');
      return;
    }
    const data = await resp.json();
    showQR(data.qr_url, data.slot_id);
    countdownValue = 35;
    startPollingStatus(data.slot_id);
  } catch (e) {
    showError('网络错误，请检查连接');
  }
}

async function pollStatus(slotId) {
  try {
    const resp = await fetch(API_BASE + '/api/v1/pool/status/' + slotId);
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.bound) { showSuccess(); return; }
    if (data.qr_status === 'scaned') showScanned();
  } catch (e) {}
}

function startPollingStatus(slotId) {
  if (statusTimer) clearInterval(statusTimer);
  statusTimer = setInterval(() => pollStatus(slotId), 2000);
}

function startCountdown() {
  if (qrTimer) clearInterval(qrTimer);
  qrTimer = setInterval(() => {
    countdownValue--;
    document.getElementById('countdown').textContent =
      countdownValue + 's 后自动刷新';
    if (countdownValue <= 0) refreshQR();
  }, 1000);
}

async function refreshQR() {
  if (document.getElementById('refreshBtn').disabled) return;
  showLoading();
  if (statusTimer) clearInterval(statusTimer);
  if (qrTimer) clearInterval(qrTimer);
  document.getElementById('countdown').textContent = '刷新中...';
  await fetchQR();
  startCountdown();
}

async function fetchStats() {
  try {
    const resp = await fetch(API_BASE + '/api/v1/pool/stats');
    if (!resp.ok) return;
    const data = await resp.json();
    document.getElementById('stats').textContent =
      '已绑定 ' + data.bound + ' / 总 ' + data.total_profiles + ' 个席位';
  } catch (e) {}
}

// Init
showLoading();
fetchQR();
startCountdown();
fetchStats();
setInterval(fetchStats, 10000);
</script>
</body>
</html>
