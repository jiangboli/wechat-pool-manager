<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Claw Do It</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-1: #0a0a1a;
    --bg-2: #1a1040;
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.25);
    --accent-subtle: rgba(245, 158, 11, 0.08);
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-glow: rgba(245, 158, 11, 0.06);
    --text-primary: rgba(255, 255, 255, 0.92);
    --text-secondary: rgba(255, 255, 255, 0.55);
    --text-muted: rgba(255, 255, 255, 0.30);
    --success: #34d399;
    --error: #f87171;
    --scan-warn: #fbbf24;
    --input-bg: rgba(255, 255, 255, 0.06);
    --input-border: rgba(255, 255, 255, 0.12);
    --input-focus: rgba(245, 158, 11, 0.5);
    --radius: 20px;
    --radius-sm: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg-1);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.15), transparent);
    top: -200px; right: -100px;
  }
  body::after {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.08), transparent);
    bottom: -150px; left: -100px;
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 36px 28px 32px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 8px 32px rgba(0,0,0,0.4),
      0 2px 8px rgba(0,0,0,0.2),
      0 0 60px var(--card-glow);
    transition: box-shadow 0.6s ease;
    text-align: center;
  }

  .logo {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--accent), #d97706);
    border-radius: 14px;
    display: block;
    object-fit: cover;
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-weight: 400;
  }

  /* ── 页面切换 ── */
  .page { display: none; }
  .page.active { display: block; }

  /* ── 表单样式 ── */
  .form-group {
    text-align: left;
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .form-group input {
    width: 100%;
    padding: 12px 14px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-group input:focus {
    border-color: var(--input-focus);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
  }

  .form-group input::placeholder {
    color: var(--text-muted);
    font-size: 14px;
  }

  .form-group .error-msg {
    font-size: 12px;
    color: var(--error);
    margin-top: 4px;
    display: none;
  }

  .form-group.has-error input {
    border-color: var(--error);
  }

  .form-group.has-error .error-msg {
    display: block;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--accent), #d97706);
    color: #0a0a1a;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px var(--accent-glow);
  }

  .submit-btn:active {
    transform: scale(0.98);
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .form-footer {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* ── QR 页面 ── */
  .prompt-text {
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 24px;
    font-weight: 500;
    letter-spacing: 0.02em;
    opacity: 0.85;
    animation: promptFade 2s ease-in-out infinite alternate;
  }

  @keyframes promptFade {
    0% { opacity: 0.65; }
    100% { opacity: 1; }
  }

  .lobster-greeting {
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 16px;
    font-weight: 500;
  }

  .lobster-greeting .name {
    color: #fff;
    font-weight: 700;
  }

  .qr-wrapper {
    position: relative;
    margin: 0 auto 20px;
    width: 220px;
    height: 220px;
  }

  .qr-box {
    width: 100%;
    height: 100%;
    border-radius: var(--radius-sm);
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.5s ease, transform 0.3s ease;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .qr-box img {
    width: 180px;
    height: 180px;
    display: block;
    image-rendering: pixelated;
  }

  .qr-placeholder {
    color: #999;
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
    padding: 20px;
  }

  .qr-box.pulsing {
    animation: qrPulse 2.5s ease-in-out infinite;
  }

  @keyframes qrPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.15); }
    50% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
  }

  .qr-box.success {
    box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.3), 0 0 40px rgba(52, 211, 153, 0.1);
  }
  .qr-box.success img { display: none; }
  .qr-box .success-icon {
    display: none;
    font-size: 56px;
    line-height: 1;
  }
  .qr-box.success .success-icon { display: block; animation: successPop 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes successPop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .qr-box.error {
    box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.2);
  }

  .qr-wrapper::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: calc(var(--radius-sm) + 6px);
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
  }

  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 28px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 4px;
    transition: color 0.3s;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
  }
  .status .dot.pulse {
    animation: dotPulse 1.2s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .status.waiting { color: var(--accent); }
  .status.waiting .dot { background: var(--accent); }
  .status.scanned { color: var(--scan-warn); }
  .status.scanned .dot { background: var(--scan-warn); }
  .status.success { color: var(--success); }
  .status.success .dot { background: var(--success); }
  .status.error { color: var(--error); }
  .status.error .dot { background: var(--error); }

  .countdown {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
    min-height: 18px;
  }

  .steps {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }

  .step {
    flex: 1;
    padding: 10px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.04);
    text-align: center;
  }

  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent-subtle);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .step-label {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.3;
  }

  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 24px;
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .refresh-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.10);
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.15);
  }

  .refresh-btn:active:not(:disabled) {
    transform: scale(0.97);
  }

  .refresh-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .refresh-btn .icon {
    font-size: 14px;
    transition: transform 0.4s ease;
  }
  .refresh-btn:not(:disabled):hover .icon {
    transform: rotate(180deg);
  }

  .stats {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
    color: var(--text-muted);
  }

  .qr-skeleton {
    width: 180px;
    height: 180px;
    border-radius: 8px;
    background: linear-gradient(135deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
    background-size: 200% 200%;
    animation: skeleton 1.5s ease-in-out infinite;
  }

  @keyframes skeleton {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .verified-phone {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    padding: 8px 12px;
    background: var(--accent-subtle);
    border-radius: var(--radius-sm);
    display: inline-block;
  }

  .bound-warn {
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.25);
    border-radius: var(--radius-sm);
    text-align: center;
  }
  .bound-warn p {
    color: var(--error);
    font-size: 14px;
    font-weight: 500;
  }

  /* Back link */
  .back-link {
    display: inline-block;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    text-decoration: none;
  }
  .back-link:hover {
    color: var(--text-secondary);
  }

  @media (max-width: 440px) {
    body { padding: 12px; }
    .card { padding: 24px 16px 24px; border-radius: 16px; }
    .qr-wrapper { width: 180px; height: 180px; }
    .qr-box img { width: 150px; height: 150px; }
    .qr-skeleton { width: 150px; height: 150px; }
    h1 { font-size: 20px; }
    .steps { flex-direction: column; gap: 4px; }
    .step { display: flex; align-items: center; gap: 8px; padding: 8px 12px; text-align: left; }
    .step-num { margin-bottom: 0; flex-shrink: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .qr-box.pulsing { animation: none; }
    .qr-skeleton { animation: none; }
    .refresh-btn .icon { transition: none; }
    .refresh-btn:not(:disabled):hover .icon { transform: none; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<div class="container">
  <div class="card">
    <!-- Logo -->
    <img class="logo" src="/static/dosh.png" alt="logo">
    <h1>Just Claw Do It</h1>
    <p class="subtitle">在微信里养一只属于自己的虾</p>

    <!-- ── Page 1: 手机号验证 ── -->
    <div class="page active" id="pagePhone">
      <p class="prompt-text">📱 先验证手机号</p>

      <div class="form-group" id="fgPhoneVerify">
        <label>手机号</label>
        <input type="tel" id="inputPhoneVerify" placeholder="请输入手机号" maxlength="20" autocomplete="tel">
        <div class="error-msg" id="phoneVerifyError">请填写手机号</div>
      </div>

      <button class="submit-btn" id="verifyBtn" onclick="verifyPhone()">✅ 验证手机号</button>

      <div id="phoneAlreadyBound" style="display:none;" class="bound-warn">
        <p>⚠️ 该手机号已绑定，不能重复绑定</p>
      </div>

      <div class="form-footer">
        验证通过后即可为您的微信绑定机器人
      </div>
    </div>

    <!-- ── Page 2: 信息填写 ── -->
    <div class="page" id="pageInfo">
      <p class="prompt-text">🦐 填写信息，领养您的虾</p>
      <p class="verified-phone" id="verifiedPhoneDisplay">手机号：<span id="verifiedPhone"></span></p>

      <div class="form-group" id="fgUser">
        <label>用户名</label>
        <input type="text" id="inputUser" placeholder="怎么称呼您？" maxlength="64" autocomplete="name">
        <div class="error-msg">请填写用户名</div>
      </div>

      <div class="form-group" id="fgLobster">
        <label>龙虾名</label>
        <input type="text" id="inputLobster" placeholder="给您的机器人取个名字" maxlength="64">
        <div class="error-msg">请填写龙虾名</div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitForm()">🐉 开始绑定</button>

      <a class="back-link" onclick="backToPhone()">← 更换手机号</a>

      <div class="form-footer">
        提交后我们将为您分配一个专属二维码，扫码即可完成绑定
      </div>
    </div>

    <!-- ── Page 3: 扫码 ── -->
    <div class="page" id="pageQR">
      <p class="lobster-greeting" id="greeting">亲爱的 <span class="name" id="lobsterName"></span>，请扫码</p>
      <p class="prompt-text">📢 用微信扫一扫认领您的虾</p>

      <div class="qr-wrapper">
        <div class="qr-box pulsing" id="qrBox">
          <div class="qr-placeholder" id="qrContent">
            <div class="qr-skeleton"></div>
          </div>
          <div class="success-icon">✓</div>
        </div>
      </div>

      <div class="status" id="status">
        <span class="dot pulse" id="statusDot"></span>
        <span id="statusText">准备中...</span>
      </div>
      <div class="countdown" id="countdown"></div>

      <div class="steps">
        <div class="step">
          <div class="step-num">1</div>
          <div class="step-label">打开微信「扫一扫」</div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-label">扫描上方二维码</div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-label">确认登录，自动绑定</div>
        </div>
      </div>

      <button class="refresh-btn" id="refreshBtn" onclick="refreshQR()">
        <span class="icon">↻</span>
        刷新二维码
      </button>

      <a class="back-link" onclick="backToForm()">← 重新填写信息</a>

      <div class="stats" id="stats"></div>
    </div>
  </div>
</div>

<script>
const API_BASE = '';
let currentSlot = null;
let qrTimer = null;
let statusTimer = null;
let imageRefreshTimer = null;
let countdownValue = 50;
let lastQrUrl = '';

// ── 手机号验证 ──

async function verifyPhone() {
  const phone = document.getElementById('inputPhoneVerify').value.trim();
  const errorEl = document.getElementById('phoneVerifyError');
  const boundEl = document.getElementById('phoneAlreadyBound');

  if (!phone) {
    errorEl.textContent = '请填写手机号';
    document.getElementById('fgPhoneVerify').classList.add('has-error');
    return;
  }
  document.getElementById('fgPhoneVerify').classList.remove('has-error');
  boundEl.style.display = 'none';

  const btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 验证中...';

  try {
    const resp = await fetch(API_BASE + '/api/v1/bind/check-phone?phone=' + encodeURIComponent(phone));
    const data = await resp.json();

    if (data.exists) {
      boundEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '✅ 验证手机号';
      return;
    }

    // 手机号可用 → 切换到信息填写页
    document.getElementById('verifiedPhone').textContent = phone;
    document.getElementById('pagePhone').classList.remove('active');
    document.getElementById('pageInfo').classList.add('active');
    btn.disabled = false;
    btn.textContent = '✅ 验证手机号';

  } catch (e) {
    alert('网络错误，请检查连接后重试');
    btn.disabled = false;
    btn.textContent = '✅ 验证手机号';
  }
}

function backToPhone() {
  document.getElementById('pageInfo').classList.remove('active');
  document.getElementById('pagePhone').classList.add('active');
  document.getElementById('inputPhoneVerify').value = '';
  document.getElementById('phoneAlreadyBound').style.display = 'none';
}

// ── 信息提交 ──

function validateForm() {
  let valid = true;
  ['User', 'Lobster'].forEach(f => {
    const el = document.getElementById('fg' + f);
    const input = document.getElementById('input' + f);
    if (!input.value.trim()) {
      el.classList.add('has-error');
      valid = false;
    } else {
      el.classList.remove('has-error');
    }
  });
  return valid;
}

function clearErrors() {
  ['User', 'Lobster'].forEach(f => {
    document.getElementById('fg' + f).classList.remove('has-error');
  });
}

async function submitForm() {
  clearErrors();
  if (!validateForm()) return;

  const phone = document.getElementById('verifiedPhone').textContent;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 请稍候...';

  try {
    const resp = await fetch(API_BASE + '/api/v1/bind/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: phone,
        user_name: document.getElementById('inputUser').value.trim(),
        lobster_name: document.getElementById('inputLobster').value.trim(),
      }),
    });

    if (!resp.ok) {
      const err = await resp.text();
      alert('操作失败：' + (err || resp.statusText));
      btn.disabled = false;
      btn.textContent = '🐉 开始绑定';
      return;
    }

    const data = await resp.json();
    // 切换到扫码页面
    document.getElementById('pageInfo').classList.remove('active');
    document.getElementById('pageQR').classList.add('active');
    document.getElementById('lobsterName').textContent = document.getElementById('inputUser').value.trim();

    if (data.rebind) {
        // 已绑用户重新绑定——使用专属 QR
        showRebindQR(data.qr_url, data.profile_name, data.pending_token);
        countdownValue = 50;
        startPollingRebindStatus(data.pending_token);
        startCountdown();
        fetchStats();
    } else {
        showQR(data.qr_url, data.slot_id);
        countdownValue = 50;
        startPollingStatus(data.slot_id);
        startCountdown();
        startImageRefresh();
        fetchStats();
    }

  } catch (e) {
    alert('网络错误，请检查连接后重试');
    btn.disabled = false;
    btn.textContent = '🐉 开始绑定';
  }
}

function backToForm() {
  // 停止所有定时器
  if (qrTimer) clearInterval(qrTimer);
  if (statusTimer) clearInterval(statusTimer);
  if (imageRefreshTimer) clearInterval(imageRefreshTimer);
  currentSlot = null;

  document.getElementById('pageQR').classList.remove('active');
  document.getElementById('pageInfo').classList.add('active');
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '🐉 开始绑定';
}

// ── QR 操作 ──

function showError(msg) {
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box error';
  qrBox.classList.remove('pulsing');
  document.getElementById('qrContent').innerHTML = '<div class="qr-placeholder">' + msg + '</div>';
  setStatus(msg, 'error');
}

function showLoading() {
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box';
  qrBox.classList.add('pulsing');
  document.getElementById('qrContent').innerHTML = '<div class="qr-skeleton"></div>';
  setStatus('获取中...', '');
}

function showRebindQR(url, profileName, pendingToken) {
  currentSlot = profileName;
  lastQrUrl = url;
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box';
  qrBox.classList.add('pulsing');
  document.getElementById('qrContent').innerHTML =
    '<img src="' + url + '" alt="微信二维码" id="qrImg" onerror="this.onerror=null;showError(\'二维码加载失败\')" style="max-width:200px;max-height:200px;">';
  setStatus('重新绑定：请使用微信扫码', 'waiting');
  document.getElementById('refreshBtn').disabled = true;
  document.querySelector('.form-footer .hint').textContent = '扫码后将刷新你的机器人凭证，容器会自动重启';
}

function showQR(url, slotId) {
  currentSlot = slotId;
  lastQrUrl = url;
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box';
  qrBox.classList.add('pulsing');
  document.getElementById('qrContent').innerHTML =
    '<img src="/api/v1/pool/qr-image/' + slotId + '?t=' + Date.now() +
    '" alt="微信二维码" id="qrImg" onerror="this.onerror=null;showError(\'二维码加载失败\')">';
  setStatus('等待扫码...', 'waiting');
  document.getElementById('refreshBtn').disabled = false;
}

function refreshSlotImage() {
  if (!currentSlot) return;
  const img = document.getElementById('qrImg');
  if (img) {
    img.src = '/api/v1/pool/qr-image/' + currentSlot + '?t=' + Date.now();
  }
}

function showScanned() {
  setStatus('已扫码！请在手机上确认...', 'scanned');
}

function showSuccess() {
  const qrBox = document.getElementById('qrBox');
  qrBox.className = 'qr-box success';
  qrBox.classList.remove('pulsing');
  document.getElementById('qrContent').innerHTML = '';
  setStatus('绑定成功！你已领养了一只 do 大龙虾 ✨', 'success');
  document.getElementById('refreshBtn').disabled = true;
  if (qrTimer) clearInterval(qrTimer);
  if (statusTimer) clearInterval(statusTimer);
  if (imageRefreshTimer) clearInterval(imageRefreshTimer);
}

function setStatus(text, type) {
  const el = document.getElementById('status');
  const dot = document.getElementById('statusDot');
  const textEl = document.getElementById('statusText');
  el.className = 'status' + (type ? ' ' + type : '');
  dot.className = 'dot' + (type ? ' pulse' : '');
  textEl.textContent = text;
}

async function pollStatus(slotId) {
  try {
    const resp = await fetch(API_BASE + '/api/v1/pool/status/' + slotId);
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.bound) { showSuccess(); return; }
    if (data.qr_status === 'scaned') { showScanned(); return; }
    if (data.qr_status === 'expired') {
      setStatus('二维码已过期，正在刷新...', 'error');
      setTimeout(refreshSlotImage, 500);
      return;
    }
    if (data.qr_url && data.qr_url !== lastQrUrl) {
      lastQrUrl = data.qr_url;
      refreshSlotImage();
    }
  } catch (e) {}
}

async function pollRebindStatus(pendingToken) {
  try {
    const resp = await fetch(API_BASE + '/api/v1/bind/rebind-status/' + pendingToken);
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.status === 'confirmed') { showSuccess(); return; }
    if (data.status === 'scaned') { showScanned(); return; }
    if (data.status === 'expired' || data.status === 'error' || data.status === 'timeout') {
      setStatus('二维码已过期，请重新提交', 'error');
      document.getElementById('refreshBtn').disabled = false;
      if (statusTimer) clearInterval(statusTimer);
      return;
    }
  } catch (e) {}
}

function startPollingRebindStatus(pendingToken) {
  if (statusTimer) clearInterval(statusTimer);
  statusTimer = setInterval(() => pollRebindStatus(pendingToken), 2000);
}

function startPollingStatus(slotId) {
  if (statusTimer) clearInterval(statusTimer);
  statusTimer = setInterval(() => pollStatus(slotId), 2000);
}

function startCountdown() {
  if (qrTimer) clearInterval(qrTimer);
  qrTimer = setInterval(() => {
    countdownValue--;
    document.getElementById('countdown').textContent =
      countdownValue + 's 后自动刷新';
    if (countdownValue <= 0) refreshQR();
  }, 1000);
}

function startImageRefresh() {
  if (imageRefreshTimer) clearInterval(imageRefreshTimer);
  imageRefreshTimer = setInterval(() => {
    if (currentSlot && document.getElementById('qrImg')) {
      refreshSlotImage();
    }
  }, 25000);
}

async function refreshQR() {
  if (document.getElementById('refreshBtn').disabled) return;
  // 停止所有定时器
  if (statusTimer) clearInterval(statusTimer);
  if (qrTimer) clearInterval(qrTimer);
  if (imageRefreshTimer) clearInterval(imageRefreshTimer);
  document.getElementById('countdown').textContent = '刷新中...';

  if (currentSlot) {
    const img = document.getElementById('qrImg');
    if (img) {
      // 直接刷新图片 src，不删除 img 标签
      img.src = '/api/v1/pool/qr-image/' + currentSlot + '?t=' + Date.now();
      countdownValue = 50;
      setStatus('刷新中...', 'waiting');
      startPollingStatus(currentSlot);
      startCountdown();
      startImageRefresh();
    }
  }
}

async function fetchStats() {
  try {
    const resp = await fetch(API_BASE + '/api/v1/pool/stats');
    if (!resp.ok) return;
    const data = await resp.json();
    document.getElementById('stats').textContent =
      '已绑定 ' + data.bound + ' / 总 ' + data.total_profiles + ' 个席位';
  } catch (e) {}
}

// 输入时清除错误状态
['Phone', 'User', 'Lobster'].forEach(f => {
  document.getElementById('input' + f).addEventListener('input', function() {
    document.getElementById('fg' + f).classList.remove('has-error');
  });
});
</script>
