<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Just Claw Do It — 抢虾苗大战</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-1: #0a0a1a;
    --bg-2: #1a1040;
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.25);
    --accent-subtle: rgba(245, 158, 11, 0.08);
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-hover-bg: rgba(255, 255, 255, 0.07);
    --text-primary: rgba(255, 255, 255, 0.92);
    --text-secondary: rgba(255, 255, 255, 0.55);
    --text-muted: rgba(255, 255, 255, 0.30);
    --success: #34d399;
    --success-glow: rgba(52, 211, 153, 0.2);
    --error: #f87171;
    --warn: #fbbf24;
    --warn-glow: rgba(251, 191, 36, 0.15);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg-1);
    min-height: 100vh;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* Background orbs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.12), transparent);
    top: -200px; right: -100px;
  }
  body::after {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.07), transparent);
    bottom: -150px; left: -100px;
  }

  .grain {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none; opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 900px; margin: 0 auto;
  }

  /* ── Header ── */
  .header {
    text-align: center; margin-bottom: 16px;
    padding: 24px 20px 20px;
    background: var(--card-bg);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 8px 32px rgba(0,0,0,0.3);
  }

  .logo {
    width: 44px; height: 44px;
    margin: 0 auto 10px;
    background: linear-gradient(135deg, var(--accent), #d97706);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .header h1 {
    font-size: 20px; font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-primary); margin-bottom: 2px;
  }

  .header .subtitle {
    font-size: 13px; color: var(--text-secondary);
    margin-bottom: 12px;
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-bottom: 4px;
  }
  .stats-bar .num {
    font-size: 28px; font-weight: 700; color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 2ch; letter-spacing: -0.03em;
  }
  .stats-bar .label {
    font-size: 14px; color: var(--text-secondary);
  }
  .stats-bar .label strong { color: var(--text-primary); font-weight: 600; }

  .progress-wrap {
    width: 100%; max-width: 320px; margin: 8px auto 0;
    height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .progress-bar {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), #d97706);
    transition: width 0.8s var(--transition);
    width: 0%;
  }

  /* ── Ticker ── */
  .ticker-wrap {
    margin-top: 10px;
    height: 24px; overflow: hidden;
    position: relative;
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
  }
  .ticker-inner {
    position: absolute; white-space: nowrap;
    will-change: transform;
    font-size: 12px; color: var(--text-muted);
    line-height: 24px; padding: 0 12px;
    animation: tickerScroll 20s linear infinite;
  }
  @keyframes tickerScroll {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }
  .ticker-inner span { color: var(--success); font-weight: 500; }

  /* ── Slot grid ── */
  .slot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }

  .slot-card {
    background: var(--card-bg);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
  }

  .slot-card:hover {
    background: var(--card-hover-bg);
    border-color: rgba(255,255,255,0.12);
  }

  /* Slot index badge */
  .slot-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px; font-weight: 600;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.05);
    margin-bottom: 8px;
  }

  /* QR code box */
  .qr-wrap {
    width: 140px; height: 140px;
    margin: 0 auto 8px;
    border-radius: var(--radius-sm);
    background: white;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: all var(--transition);
  }
  .qr-wrap img {
    width: 120px; height: 120px;
    display: block;
    image-rendering: pixelated;
  }
  .qr-wrap .qr-placeholder {
    color: #999; font-size: 11px;
    text-align: center; line-height: 1.4; padding: 10px;
  }
  .qr-skeleton {
    width: 120px; height: 120px;
    border-radius: 6px;
    background: linear-gradient(135deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
    background-size: 200% 200%;
    animation: skeleton 1.5s ease-in-out infinite;
  }
  @keyframes skeleton {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Breathing pulse for waiting */
  .qr-wrap.pulse-waiting {
    animation: qrPulseAmber 2.5s ease-in-out infinite;
  }
  @keyframes qrPulseAmber {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
    50% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0.08); }
  }

  /* Scanned flash */
  .qr-wrap.pulse-scanned {
    animation: scanFlash 0.6s ease 2;
  }
  @keyframes scanFlash {
    0%, 100% { box-shadow: 0 0 0 0 var(--warn-glow); }
    50% { box-shadow: 0 0 0 12px rgba(251, 191, 36, 0.2); }
  }

  /* Bound success — hide QR, show checkmark */
  .qr-wrap.bound {
    background: linear-gradient(135deg, rgba(52, 211, 153, 0.1), rgba(16, 185, 129, 0.05));
    border: 1px solid rgba(52, 211, 153, 0.2);
    animation: successPop 0.6s var(--transition);
  }
  .qr-wrap.bound img { display: none; }
  .qr-wrap.bound .qr-placeholder { display: none; }
  .qr-wrap.bound .bound-icon { display: flex; }

  .bound-icon {
    display: none;
    font-size: 42px; line-height: 1;
    color: var(--success);
    animation: successPop 0.6s var(--transition);
  }
  @keyframes successPop {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Status label */
  .slot-status {
    display: flex; align-items: center; justify-content: center;
    gap: 5px; font-size: 13px; font-weight: 500;
    min-height: 20px; margin-bottom: 2px;
    transition: all var(--transition);
  }
  .slot-status .dot {
    width: 5px; height: 5px; border-radius: 50%;
    transition: background 0.3s;
  }
  .slot-status .dot.pulse {
    animation: dotPulse 1.2s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  .slot-status.waiting { color: var(--accent); }
  .slot-status.waiting .dot { background: var(--accent); }

  .slot-status.scaned { color: var(--warn); }
  .slot-status.scaned .dot { background: var(--warn); }
  .slot-status.scan-flash .dot { animation: none; background: var(--warn); }

  .slot-status.bound { color: var(--success); }
  .slot-status.bound .dot { background: var(--success); }

  .slot-status.expired { color: var(--error); }
  .slot-status.expired .dot { background: var(--error); }

  .slot-status.idle { color: var(--text-muted); }
  .slot-status.idle .dot { background: var(--text-muted); }

  .slot-time {
    font-size: 10px; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* ── Confetti burst on bound ── */
  .confetti-container {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden;
  }
  .confetti-piece {
    position: absolute; width: 6px; height: 6px;
    border-radius: 2px;
    animation: confettiFall 1.2s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-60px) rotate(360deg); opacity: 0; }
  }

  /* ── Loading / Error state ── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; display: block; }
  .empty-state .retry-btn {
    margin-top: 12px;
    padding: 8px 20px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .empty-state .retry-btn:hover {
    background: rgba(255,255,255,0.08);
    color: var(--text-primary);
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    margin-top: 16px;
    padding: 12px;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    body { padding: 10px; }
    .header { padding: 18px 14px 16px; }
    .slot-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .slot-card { padding: 12px; }
    .qr-wrap { width: 110px; height: 110px; }
    .qr-wrap img { width: 90px; height: 90px; }
    .qr-skeleton { width: 90px; height: 90px; }
  }

  @media (max-width: 360px) {
    .slot-grid { grid-template-columns: 1fr 1fr; }
    .qr-wrap { width: 90px; height: 90px; }
    .qr-wrap img { width: 70px; height: 70px; }
    .qr-skeleton { width: 70px; height: 70px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .qr-wrap.pulse-waiting { animation: none; }
    .ticker-inner { animation: none; transform: none; }
    .confetti-piece { animation: none; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo">🦞</div>
    <h1>Just Claw Do It</h1>
    <p class="subtitle">🔥 抢虾苗大战 · 先到先得 🔥</p>

    <!-- Stats -->
    <div class="stats-bar">
      <span class="num" id="boundNum">0</span>
      <span class="label">/ <strong id="totalNum">0</strong> 个席位已被领养</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Ticker -->
    <div class="ticker-wrap">
      <div class="ticker-inner" id="ticker">📢 扫描二维码即可领养您的 do 大龙虾 🦞</div>
    </div>
  </div>

  <!-- Slot Grid -->
  <div class="slot-grid" id="slotGrid">
    <div class="empty-state" id="emptyState">
      <span class="icon">🦞</span>
      正在加载坑位...
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">Just Claw Do It — 在微信里养一只属于自己的虾</div>
</div>

<script>
const API_BASE = '';
const POLL_INTERVAL = 2000;
const TICKER_ITEMS = [];

let prevSlots = {};  // profile → status for transition detection

// ── Render ──

function renderSlots(data) {
  const grid = document.getElementById('slotGrid');
  const empty = document.getElementById('emptyState');

  if (!data || !data.slots || data.slots.length === 0) {
    if (empty) {
      empty.style.display = 'block';
      empty.innerHTML = '<span class="icon">🕐</span>暂无可用坑位<br><small>稍等片刻，新坑位即将就绪</small>';
    }
    return;
  }

  if (empty) empty.style.display = 'none';

  // Update stats
  document.getElementById('boundNum').textContent = data.bound_count;
  document.getElementById('totalNum').textContent = data.total_slots;
  const pct = data.total_slots > 0 ? (data.bound_count / data.total_slots * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';

  // Build cards
  let html = '';
  for (const s of data.slots) {
    const prevStatus = prevSlots[s.profile];
    prevSlots[s.profile] = s.status;

    // Detect transitions for animation
    const justBound = prevStatus && prevStatus !== 'bound' && s.bound;
    const justScanned = prevStatus === 'waiting' && s.status === 'scaned';
    const isNew = prevStatus === undefined;

    const statusClass = getStatusClass(s, justBound, justScanned);

    html += '<div class="slot-card" data-profile="' + s.profile + '">';
    html += '  <div class="slot-badge">🎯 ' + s.display_name + '</div>';

    // QR / bound icon
    html += '  <div class="qr-wrap ' + getQrClass(s, justBound) + '" id="qr-' + s.profile + '">';
    if (s.bound) {
      html += '    <div class="bound-icon">✓</div>';
      if (justBound) {
        html += '    <div class="confetti-container" id="confetti-' + s.profile + '"></div>';
      }
    } else if (s.qr_url) {
      html += '    <img src="/api/v1/pool/qr-image/' + s.profile + '?t=' + Date.now() + '" alt="二维码" loading="lazy">';
    } else {
      html += '    <div class="qr-placeholder">获取中<br>请稍候...</div>';
    }
    html += '  </div>';

    // Status
    html += '  <div class="slot-status ' + statusClass + '" id="status-' + s.profile + '">';
    html += '    <span class="dot' + (s.status === 'waiting' && !s.bound ? ' pulse' : '') + '"></span>';
    html += '    <span>' + getStatusText(s) + '</span>';
    html += '  </div>';

    // Time
    if (s.refreshed_at && !s.bound) {
      html += '  <div class="slot-time">🔄 ' + s.refreshed_at + '</div>';
    }
    if (s.bound_at) {
      html += '  <div class="slot-time">✅ ' + s.bound_at + '</div>';
    }
    html += '</div>';

    // Ticker: new bound
    if (justBound && s.user_id) {
      TICKER_ITEMS.unshift(s.display_name + ' 已被 ' + s.user_id + ' 领养了！🎉');
    } else if (justScanned) {
      TICKER_ITEMS.unshift(s.display_name + ' 已被扫码！🔥');
    }

    // Confetti burst
    if (justBound) {
      setTimeout(() => spawnConfetti(s.profile), 100);
    }
  }

  grid.innerHTML = html;

  // Update ticker
  updateTicker();
}

function getStatusClass(s, justBound, justScanned) {
  if (s.bound) return 'bound';
  if (s.status === 'scaned') return 'scaned';
  if (s.status === 'expired' || s.status === 'expired') return 'expired';
  if (s.status === 'waiting') return 'waiting';
  if (s.status === 'idle') return 'idle';
  return '';
}

function getQrClass(s, justBound) {
  if (s.bound) return 'bound';
  if (s.status === 'waiting') return 'pulse-waiting';
  if (s.status === 'scaned') return 'pulse-scanned';
  return '';
}

function getStatusText(s) {
  if (s.bound) return '已被领养 ✅';
  if (s.status === 'scaned') return '已被扫码 🔍';
  if (s.status === 'expired') return '已过期 ❌';
  if (s.status === 'waiting') return '待抢 🔥';
  if (s.status === 'idle') return '准备中...';
  return s.status;
}

// ── Confetti ──

function spawnConfetti(profile) {
  const container = document.getElementById('confetti-' + profile);
  if (!container) return;
  const colors = ['#f59e0b', '#34d399', '#6366f1', '#f87171', '#fbbf24', '#a78bfa'];
  for (let i = 0; i < 16; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random() * 80 + 10) + '%';
    piece.style.top = (Math.random() * 40 + 60) + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.3) + 's';
    piece.style.width = (Math.random() * 4 + 4) + 'px';
    piece.style.height = (Math.random() * 4 + 4) + 'px';
    container.appendChild(piece);
  }
  setTimeout(() => { if (container) container.innerHTML = ''; }, 1600);
}

// ── Ticker ──

function updateTicker() {
  const ticker = document.getElementById('ticker');
  if (TICKER_ITEMS.length > 0) {
    const text = TICKER_ITEMS.slice(0, 8).join(' &nbsp;·&nbsp; ');
    ticker.innerHTML = '🔥 ' + text + ' &nbsp;·&nbsp; 📢 手慢无！';
    // Restart animation
    ticker.style.animation = 'none';
    void ticker.offsetWidth;
    ticker.style.animation = 'tickerScroll 25s linear infinite';
  }
}

// ── Polling ──

async function pollSlots() {
  try {
    const resp = await fetch(API_BASE + '/api/v1/pool/hot-slots');
    if (!resp.ok) {
      if (resp.status === 503) {
        document.getElementById('slotGrid').innerHTML =
          '<div class="empty-state"><span class="icon">🕐</span>热池尚未启动<br><small>请稍后刷新</small></div>';
      }
      return;
    }
    const data = await resp.json();
    renderSlots(data);
  } catch (e) {
    // Silently retry on next poll
  }
}

// ── Image lazy refresh (per slot, every 20s) ──

function startImageRefresh() {
  setInterval(() => {
    document.querySelectorAll('.slot-card img').forEach(img => {
      const src = img.getAttribute('src');
      if (src && src.includes('/api/v1/pool/qr-image/')) {
        const base = src.split('?')[0];
        img.src = base + '?t=' + Date.now();
      }
    });
  }, 20000);
}

// ── Init ──

pollSlots();
setInterval(pollSlots, POLL_INTERVAL);
startImageRefresh();
</script>
</body>
</html>
