<!DOCTYPE html><html lang=zh><head><meta charset=utf-8>
<title>Claw DO 看板</title>
<script src="/static/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;font-family:sans-serif}
body{background:#0f172a;color:#e2e8f0;padding:24px}
h1{font-size:22px;margin-bottom:20px;color:#f1f5f9}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-bottom:24px}
.c{background:#1e293b;border-radius:12px;padding:20px;text-align:center}
.c .n{font-size:30px;font-weight:700;margin-top:6px}
.c .l{font-size:13px;color:#94a3b8}
.r{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.b{background:#1e293b;border-radius:12px;padding:20px}
.b h3{font-size:14px;margin-bottom:12px;color:#cbd5e1}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid #1e293b;text-align:left}
th{color:#64748b;font-weight:500;background:#0f172a;border-radius:6px}
td{font-family:monospace}
.tg{cursor:pointer;user-select:none}
.tg:hover{color:#3b82f6}
.ht{overflow-x:auto}
.ht table{font-size:11px;text-align:center}
.ht th,.ht td{padding:2px 0;min-width:24px;border:1px solid #1e293b;text-align:center;font-size:11px;font-family:monospace}
.ht th.hour{color:#94a3b8;font-size:9px;font-weight:400;background:#0f172a}
.ht td.day{color:#94a3b8;font-size:10px;text-align:right;padding-right:4px;background:#0f172a;white-space:nowrap}
@media(max-width:768px){.g{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:repeat(4,1fr)}.r{grid-template-columns:1fr}}
</style></head><body>
<h1>Claw DO 看板 <span style=font-size:13px;color:#64748b id=updateTime></span></h1>
<div class=g>
<div class=c><div class=l>总用户数</div><div class=n style=color:#818cf8 id=totalUsers>-</div></div>
<div class=c><div class=l>今日新增</div><div class=n style=color:#34d399 id=todayNewUsers>-</div></div>
<div class=c><div class=l>DAU今日</div><div class=n style=color:#a855f7 id=dauToday>-</div></div>
<div class=c><div class=l>平均延迟</div><div class=n style=color:#f59e0b id=avgLatency>-</div></div>
</div>
<div class=g2>
<div class=c><div class=l>今日请求</div><div class=n style=color:#22c55e id=todayReqs>-</div></div>
<div class=c><div class=l>Token消耗</div><div class=n style=color:#3b82f6 id=todayTokens>-</div></div>
<div class=c><div class=l>人均请求</div><div class=n style=color:#14b8a6 id=perUserReqs>-</div></div>
<div class=c><div class=l>人均Token</div><div class=n style=color:#06b6d4 id=perUserTokens>-</div></div>
<div class=c><div class=l>错误率</div><div class=n id=errorRate>-</div></div>
<div class=c><div class=l>错误数</div><div class=n id=errorCount>-</div></div>
<div class=c><div class=l>💰 总余额</div><div class=n style=color:#fbbf24 id=totalBalance>-</div></div>
<div class=c><div class=l>📉 今日消耗</div><div class=n style=color:#f87171 id=todayCost>-</div></div>
</div>
<div class=r><div class=b><h3>Token排行 Top10（今天）</h3><table id=reqTable><tr><th>#</th><th>用户</th><th>Token(万)</th></tr></table></div>
<div class=b><h3>Token排行 Top10（7天）</h3><table id=tokenTable><tr><th>#</th><th>用户</th><th>Token(万)</th></tr></table></div></div>
<div class=r>
<div class=b><h3>小时请求热力图（7天）</h3><div class=ht id=heatmapDiv></div></div>
<div class=b><h3>30天Token使用量趋势</h3><div style=height:250px><canvas id=c2></canvas></div></div>
</div>
<div class=r>
<div class=b><h3>容器健康分布</h3><div style=height:300px><canvas id=c3></canvas></div></div>
<div class=b><h3>DAU趋势（30天）</h3><div style=height:250px><canvas id=c4></canvas></div></div>
</div>
<div class=r>
<div class=b><h3>话题分布（7天）</h3><div style=height:300px><canvas id=c5></canvas></div></div>
<div class=b><h3>💰 余额详情 <span style=font-size:12px;color:#64748b>📊 本月消耗 <span id=monthCostTotal>-</span></span> <span class=tg id=balanceToggle style=font-size:12px;color:#3b82f6;margin-left:12px>▼ 收起</span></h3>
<div id=balanceList style=display:block><table id=balTable><tr><th>Label</th><th>余额</th><th>今日消耗</th><th>本月消耗</th></tr></table></div></div>
</div>
<script>
function fmt(n){return typeof n==='number'?n.toLocaleString():n}
function fmtWan(n){return typeof n!=='number'?n:(n/10000).toFixed(1)+'万'}
function fmtYuan(n){return typeof n!=='number'?n:'¥'+n.toFixed(2)}
var chart2,chart3,chart4,chart5;
var balVisible=true;
document.getElementById('balanceToggle').onclick=function(){
  balVisible=!balVisible;
  document.getElementById('balanceList').style.display=balVisible?'block':'none';
  document.getElementById('balanceToggle').textContent=balVisible?'▼ 收起':'▶ 展开';
};

function renderHeatmap(data){
  var div=document.getElementById('heatmapDiv');
  if(!data||!data.length){div.innerHTML='<div style=color:#64748b;padding:20px;text-align:center>暂无数据</div>';return}
  // Group by day, find max
  var map={}, max=0, days=[], hours=Array.from({length:24},(_,i)=>i);
  data.forEach(function(r){
    var d=r[0],h=r[1],c=r[2];
    if(!map[d]){map[d]={};days.push(d)}
    map[d][h]=c;
    if(c>max)max=c;
  });
  var html='<table><tr><th></th>';
  for(var h=0;h<24;h++)html+='<th class=hour>'+h+'</th>';
  html+='</tr>';
  days.forEach(function(d){
    html+='<tr><td class=day>'+d.slice(-2)+'</td>';
    for(var h=0;h<24;h++){
      var c=map[d]&&map[d][h]||0;
      var p=max>0?c/max:0;
      var r=Math.round(22+p*233);
      var g=Math.round(30+p*130);
      var b=Math.round(45+p*181);
      html+='<td style=background:rgb('+r+','+g+','+b+');color:'+(p>0.4?'#fff':'#94a3b8')+'>'+(c||'')+'</td>';
    }
    html+='</tr>';
  });
  html+='</table>';
  div.innerHTML=html;
}

async function load(){
  try{
    var r=await fetch('/api/v1/dashboard');
    var d=await r.json();
    if(!d||d.today_calls===undefined)return;
    document.getElementById('totalUsers').textContent=fmt(d.total_users);
    document.getElementById('todayNewUsers').textContent=fmt(d.today_new_users);
    document.getElementById('dauToday').textContent=fmt(d.dau_today);
    document.getElementById('avgLatency').textContent=fmt(d.avg_latency)+'ms';
    document.getElementById('todayReqs').textContent=fmt(d.today_calls);
    document.getElementById('todayTokens').textContent=fmtWan(d.today_tokens);
    document.getElementById('perUserReqs').textContent=d.per_user_calls!==undefined?d.per_user_calls:'-';
    document.getElementById('perUserTokens').textContent=d.per_user_tokens?fmt(Math.round(d.per_user_tokens)):'-';
    var er=d.today_calls>0?(d.today_errors/d.today_calls*100).toFixed(2):'0.00';
    var ec=document.getElementById('errorRate');ec.textContent=er+'%';
    ec.style.color=d.today_errors>0?'#ef4444':'#22c55e';
    document.getElementById('errorCount').textContent=fmt(d.today_errors);
    document.getElementById('errorCount').style.color=d.today_errors>0?'#ef4444':'#22c55e';
    if(d.total_balance!==undefined){
      document.getElementById('totalBalance').textContent=fmtYuan(d.total_balance);
      document.getElementById('todayCost').textContent=fmtYuan(d.today_cost);
      document.getElementById('monthCostTotal').textContent=fmtYuan(d.month_cost);
      var bt=document.getElementById('balTable');
      bt.innerHTML='<tr><th>Label</th><th>余额</th><th>今日消耗</th><th>本月消耗</th></tr>';
      if(d.balances)d.balances.forEach(function(b){
        bt.innerHTML+='<tr><td>'+b.label+'</td><td>'+fmtYuan(b.balance)+'</td><td>'+fmtYuan(b.today_cost)+'</td><td>'+fmtYuan(b.month_cost)+'</td></tr>';
      });
    }
    var rt=document.getElementById('reqTable');
    rt.innerHTML='<tr><th>#</th><th>用户</th><th>Token(万)</th></tr>';
    d.top_req.forEach(function(r,i){rt.innerHTML+='<tr><td>'+(i+1)+'</td><td>'+r[0]+'</td><td>'+fmtWan(r[1])+'</td></tr>'});
    var tt=document.getElementById('tokenTable');
    tt.innerHTML='<tr><th>#</th><th>用户</th><th>Token(万)</th></tr>';
    d.top_tok.forEach(function(r,i){tt.innerHTML+='<tr><td>'+(i+1)+'</td><td>'+r[0]+'</td><td>'+fmtWan(r[1])+'</td></tr>'});

    // Heatmap
    renderHeatmap(d.heatmap);

    // Charts
    if(chart2)chart2.destroy();if(chart3)chart3.destroy();if(chart4)chart4.destroy();if(chart5)chart5.destroy();

    if(d.token_trend_labels&&d.token_trend_labels.length){
      chart2=new Chart(document.getElementById('c2'),{type:'line',data:{labels:d.token_trend_labels,datasets:[{label:'Token(万)',data:d.token_trend_data.map(function(v){return Math.round(v/10000)}),borderColor:'#22c55e',tension:0.3,fill:true,backgroundColor:'rgba(34,197,94,0.1)'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#94a3b8',maxTicksLimit:15}},y:{ticks:{color:'#94a3b8'}}}}});
    }

    // 容器健康饼图
    if(d.health_labels&&d.health_labels.length){
      var hc=['#22c55e','#f59e0b','#ef4444','#a855f7','#64748b'];
      chart3=new Chart(document.getElementById('c3'),{type:'pie',data:{labels:d.health_labels,datasets:[{data:d.health_data,backgroundColor:hc}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#94a3b8',padding:8,boxWidth:12,font:{size:11}}}}}});
    }

    // DAU趋势
    if(d.dau_labels&&d.dau_labels.length){
      chart4=new Chart(document.getElementById('c4'),{type:'line',data:{labels:d.dau_labels,datasets:[{label:'DAU',data:d.dau_data,borderColor:'#a855f7',tension:0.3,fill:true,backgroundColor:'rgba(168,85,247,0.1)'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#94a3b8',maxTicksLimit:15}},y:{ticks:{color:'#94a3b8',min:0}}}}});
    }

    // 话题分布
    if(d.topic_labels&&d.topic_labels.length){
      chart5=new Chart(document.getElementById('c5'),{type:'pie',data:{labels:d.topic_labels,datasets:[{data:d.topic_data,backgroundColor:['#f59e0b','#3b82f6','#22c55e','#a855f7','#ef4444','#14b8a6','#f97316','#06b6d4','#ec4899','#84cc16','#6366f1','#d946ef','#0ea5e9','#10b981','#eab308']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#94a3b8',padding:8,boxWidth:12,font:{size:11}}}}}});
    }

    document.getElementById('updateTime').textContent=new Date().toLocaleTimeString();
  }catch(e){}
}
load();setInterval(load,300000);
</script></body></html>
